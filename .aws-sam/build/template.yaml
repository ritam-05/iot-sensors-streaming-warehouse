AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'IoTStream - Cloud-Native Data Pipeline Infrastructure

  '
Resources:
  TelemetryDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
  TelemetryQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - TelemetryDLQ
          - Arn
        maxReceiveCount: 3
  WarehouseDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
  WarehouseQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - WarehouseDLQ
          - Arn
        maxReceiveCount: 3
  DeviceStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: iotstream_device_state
      AttributeDefinitions:
      - AttributeName: device_id
        AttributeType: S
      KeySchema:
      - AttributeName: device_id
        KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
  ETLProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ETLProcessorFunction
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          WAREHOUSE_QUEUE_URL:
            Ref: WarehouseQueue
          DYNAMODB_TABLE_NAME:
            Ref: DeviceStateTable
      Policies:
      - SQSPollerPolicy:
          QueueName:
            Fn::GetAtt:
            - TelemetryQueue
            - QueueName
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - WarehouseQueue
            - QueueName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: DeviceStateTable
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - TelemetryQueue
              - Arn
            BatchSize: 10
    Metadata:
      SamResourceId: ETLProcessorFunction
  SimulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SimulatorFunction
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TELEMETRY_QUEUE_URL:
            Ref: TelemetryQueue
      Policies:
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - TelemetryQueue
            - QueueName
      Events:
        MinuteTimer:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
    Metadata:
      SamResourceId: SimulatorFunction
Outputs:
  TelemetryQueueUrl:
    Value:
      Ref: TelemetryQueue
  WarehouseQueueUrl:
    Value:
      Ref: WarehouseQueue
  DeviceStateTableName:
    Value:
      Ref: DeviceStateTable
