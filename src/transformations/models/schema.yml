version: 2

models:
  - name: silver_telemetry
    description: "Cleaned and deduplicated IoT telemetry data."
    columns:
      - name: event_id
        description: "Primary key for the telemetry event."
        tests:
          - unique
          - not_null
      - name: device_status
        description: "Current operational status of the sensor."
        tests:
          - accepted_values:
              arguments:
                values: ['ONLINE', 'OFFLINE']
      - name: battery
        description: "Battery percentage of the device."
        tests:
          - not_null

  - name: gold_hourly_machine_stats
    description: "Hourly aggregated metrics per machine."
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: metric_hour
        tests:
          - not_null