AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  IoTStream - Cloud-Native Data Pipeline Infrastructure

Resources:
  # 1. Main Telemetry Ingestion Queue & DLQ
  TelemetryDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 

  TelemetryQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600 
      ReceiveMessageWaitTimeSeconds: 20 
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TelemetryDLQ.Arn
        maxReceiveCount: 3

  # 2. Warehouse Ingestion Queue & DLQ (Phase 8)
  WarehouseDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  WarehouseQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WarehouseDLQ.Arn
        maxReceiveCount: 3

  # 3. DynamoDB Operational State Table (Phase 7)
  DeviceStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: iotstream_device_state
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      # Using provisioned capacity explicitly stays within the 25 WCU/RCU Always Free tier
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

Outputs:
  TelemetryQueueUrl:
    Value: !Ref TelemetryQueue
  WarehouseQueueUrl:
    Value: !Ref WarehouseQueue
  DeviceStateTableName:
    Value: !Ref DeviceStateTable